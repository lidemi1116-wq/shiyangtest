<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315fae">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="食养工作台">
  <title>食养品牌私域工作台</title>
  <style>
    :root{--white:#f8fbff;--paper:#f3f7fc;--paper2:#eaf2fb;--ink:#193556;--muted:#637892;--line:#cbd8e7;--blue:#3565b3;--deep:#173d79;--light:#6899d2;--gold:#b58732;--red:#b8564d;--shadow:0 22px 58px rgba(20,55,104,.13)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#dbe9f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}body:before{position:fixed;inset:-2%;z-index:-2;background:radial-gradient(circle at 20% 8%,rgba(255,255,255,.92),transparent 28%),radial-gradient(circle at 78% 18%,rgba(185,212,239,.82),transparent 30%),linear-gradient(135deg,#dbe9f7,#f8fbff 46%,#c9def4);content:""}body:after{position:fixed;inset:0;z-index:-1;background:rgba(248,251,255,.26);content:"";pointer-events:none}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:22px 18px;background:rgba(23,61,121,.94);color:var(--white);display:flex;flex-direction:column;gap:26px;box-shadow:24px 0 60px rgba(20,55,104,.16)}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(248,251,255,.58);border-radius:3px;background:rgba(248,251,255,.12);font-weight:650}.brand span,.note span{display:block;color:rgba(248,251,255,.68);font-size:10px;font-weight:650;margin-top:2px}.nav{display:grid;gap:8px}.nav button{width:100%;border:0;color:rgba(248,251,255,.76);background:transparent;border-radius:3px;padding:11px 12px;display:flex;align-items:center;gap:10px;text-align:left}.nav button.active,.nav button:hover{color:#fff;background:rgba(255,255,255,.14)}.note{margin-top:auto;border:1px solid rgba(255,255,255,.18);border-radius:3px;padding:14px;background:rgba(255,255,255,.08)}.note strong{display:block;margin-top:8px;line-height:1.45;font-weight:500}.main{min-width:0;padding:28px 28px 38px}.top,.panel-head,.toolbar,.dialog-head,.dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:14px}.top{margin-bottom:22px;padding:22px;border:1px solid rgba(203,216,231,.86);border-radius:5px;background:rgba(248,251,255,.78);box-shadow:var(--shadow);backdrop-filter:blur(12px)}.eyebrow{margin:0 0 4px;color:var(--blue);font-size:10px;font-weight:700}h1,h2,h3,p{margin-top:0}h1{margin-bottom:0;font-size:clamp(26px,4vw,42px);font-weight:650;line-height:1.18}h2{margin-bottom:0;font-size:18px;font-weight:650}.sub{max-width:560px;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.8}.actions,.row{display:flex;gap:10px}.btn,.text,.mini,.close{border:1px solid transparent;border-radius:3px;min-height:42px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.secondary,.text,.mini,.close{background:rgba(248,251,255,.72);border-color:var(--line);color:var(--ink)}.text{min-height:32px;font-size:14px}.mini{min-height:32px;padding:0 9px}.close{width:34px;padding:0;font-size:22px}.view{display:none}.view.active{display:block}.quick,.summary,.signals,.pipes,.work,.cards,.calendar{display:grid;gap:14px}.quick{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:18px}.quick button,.card,.panel,.data,.signal,.pipe,.day{background:rgba(248,251,255,.9);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow)}.quick button{display:grid;gap:9px;min-height:142px;padding:16px;color:var(--ink);text-align:left}.quick span{color:var(--blue);font-size:10px;font-weight:700}.quick strong{font-size:19px}.quick small,.muted{color:var(--muted);font-size:12px;line-height:1.7}.summary{grid-template-columns:repeat(4,minmax(150px,1fr));margin-bottom:18px}.card{padding:16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;border-left:5px solid var(--blue)}.card.danger{border-left-color:var(--red)}.card.gold{border-left-color:var(--gold)}.card.light{border-left-color:var(--light)}.label{color:var(--muted);font-size:14px}.value{font-size:32px;font-weight:650}.data{padding:16px;margin-bottom:18px}.data-head{display:flex;justify-content:space-between;gap:14px;align-items:start;margin-bottom:14px}.pulse{text-align:right}.pulse span{display:block;color:var(--muted);font-size:12px}.pulse strong{font-size:34px;color:var(--blue)}.signals{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.signal{padding:13px}.signal span,.signal small{display:block;color:var(--muted);font-size:12px}.signal strong{display:block;margin:8px 0;font-size:28px}.signal.danger strong{color:var(--red)}.pipes{grid-template-columns:repeat(3,minmax(0,1fr))}.pipe{padding:14px}.pipe h3{font-size:15px}.bar{display:grid;grid-template-columns:76px 1fr 24px;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}.track{height:8px;background:var(--paper2);border-radius:999px;overflow:hidden}.track div{height:100%;background:var(--blue);border-radius:999px}.work{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:16px}.list{display:grid;gap:10px;margin-top:14px}.empty{color:var(--muted);padding:18px 0}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px;border:1px solid var(--line);border-radius:5px;background:rgba(234,242,251,.82)}.title{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-weight:600}.meta{color:var(--muted);font-size:13px;line-height:1.55}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{border-radius:999px;padding:3px 8px;font-size:12px;font-weight:500;background:rgba(53,101,179,.12);color:var(--deep)}.chip.high{background:rgba(184,86,77,.12);color:var(--red)}.chip.medium{background:rgba(181,135,50,.14);color:#7a591c}.toolbar{margin-bottom:14px}.seg{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border:1px solid var(--line);border-radius:5px;background:rgba(248,251,255,.9)}.seg button{border:0;border-radius:3px;min-height:34px;padding:0 12px;background:transparent;color:var(--muted)}.seg button.active{background:var(--blue);color:#fff}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.script{padding:14px}.script h2{font-size:17px;margin-bottom:8px}.script p{color:var(--muted);line-height:1.55}.calendar{grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:16px}.day{padding:12px}.day span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.timeline{display:grid;gap:12px;margin-top:14px}.timeline-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:14px;background:rgba(25,53,86,.42);overflow:auto}.modal.active{display:grid}.form{width:min(560px,calc(100vw - 28px));max-height:calc(100dvh - 28px);overflow:auto;padding:18px;display:grid;gap:14px;border-radius:5px;background:var(--paper);box-shadow:0 26px 80px rgba(20,55,104,.26)}label{display:grid;gap:7px;color:var(--muted);font-size:14px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:11px;color:var(--ink);background:var(--white)}textarea{resize:vertical}
    @media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:fixed;right:12px;bottom:12px;left:12px;top:auto;z-index:80;height:auto;padding:8px;border:1px solid rgba(248,251,255,.28);border-radius:5px;background:rgba(23,61,121,.9);backdrop-filter:blur(16px)}.brand,.note{display:none}.nav{grid-template-columns:repeat(5,minmax(0,1fr))}.nav button{justify-content:center;min-height:48px;padding:8px 4px;flex-direction:column;gap:3px}.nav button span:last-child{font-size:11px;white-space:nowrap}.main{padding-bottom:94px}.quick,.summary,.signals,.pipes,.work,.cards,.calendar{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.main{padding:12px 12px 94px}.top,.toolbar{align-items:stretch;flex-direction:column}.top{padding:18px}.actions,.row{display:grid;grid-template-columns:1fr 1fr}.dialog-actions{display:grid;grid-template-columns:1fr}.quick,.summary,.signals,.pipes,.work,.cards,.calendar{grid-template-columns:1fr}.item{grid-template-columns:1fr}.timeline-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><div class="mark">米</div><div><strong>大米的食养工作台</strong><span>PRIVATE GROWTH DESK</span></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="note"><span>TODAY FOCUS</span><strong id="focus">先处理逾期，再做新增。</strong></div>
    </aside>
    <main class="main">
      <header class="top">
        <div><p class="eyebrow" id="date"></p><h1 id="title">今日工作</h1><p class="sub">成交、新代理、爆款脚本只录一次，后续跟进自动排进今日和日历。</p></div>
        <div class="actions"><button class="btn secondary" id="export">↓ 导出</button><button class="btn primary" data-open="customer">+ 客户下单</button></div>
      </header>
      <section class="view active" id="dashboard"></section>
      <section class="view" id="customers"></section>
      <section class="view" id="agents"></section>
      <section class="view" id="scripts"></section>
      <section class="view" id="calendar"></section>
    </main>
  </div>
  <div class="modal" id="modal">
    <section class="form">
      <div class="dialog-head"><h2 id="modalTitle">新增</h2><button class="close" id="close">×</button></div>
      <div id="fields"></div>
      <div class="dialog-actions"><button class="btn secondary" id="cancel">取消</button><button class="btn primary" id="save">保存</button></div>
    </section>
  </div>
  <script>
    const key="shiyang-workbench-gh-v1";const today=fmt(new Date());let view="dashboard";let type="customer";let filter={customer:"all",agent:"all",script:"all"};let draft={};const views={dashboard:"今日工作",customers:"客户档案",agents:"代理档案",scripts:"脚本库",calendar:"内容日历"};const stages={customer:["下单记录","收货回访","一周复盘","方案调整","复购维护"],agent:["加入记录","电话定心","朋友圈复盘","流量启动","独立带教"],script:["选题池","待拍摄","待剪辑","待发布","已发布"]};let tasks=JSON.parse(localStorage.getItem(key)||"null")||seed();
    function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function add(date,n){let d=new Date(date+"T00:00:00");d.setDate(d.getDate()+n);return fmt(d)}function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}function seed(){return[{id:uid(),type:"customer",name:"王姐",stage:"收货回访",action:"确认是否收到山药玉米糊，问口感味道、冲泡是否顺手，提醒开始连续 7 天打卡。",date:today,priority:"high",done:false,meta:["产品：山药玉米糊","金额：398","问题：脾胃弱、湿气重"]},{id:uid(),type:"agent",name:"代理小晴",stage:"朋友圈复盘",action:"看近 3 天朋友圈：有没有人设、产品信任、生活感和成交入口，给她改 3 条。",date:today,priority:"high",done:false,meta:["加入：本周","目标：先稳定发圈"]},{id:uid(),type:"script",name:"湿气重的人早餐别乱吃",stage:"待拍摄",action:"拍 45 秒口播：症状切入、误区提醒、给一个可执行早餐搭配。",date:today,priority:"high",done:false,meta:["来源：自己测出","爆点：早餐误区"]}]}
    function saveLocal(){localStorage.setItem(key,JSON.stringify(tasks))}function overdue(t){return !t.done&&t.date<today}function isToday(t){return !t.done&&t.date===today}function sort(a){const r={high:0,medium:1,low:2};return [...a].sort((x,y)=>x.date.localeCompare(y.date)||r[x.priority]-r[y.priority])}function status(t){return t.done?"已完成":overdue(t)?"已逾期":isToday(t)?"今日":"排期中"}function pri(p){return {high:"高优先",medium:"中优先",low:"低优先"}[p]||"中优先"}
    function render(){document.getElementById("date").textContent=new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());document.getElementById("title").textContent=views[view];document.getElementById("focus").textContent=tasks.filter(overdue).length?`先清掉 ${tasks.filter(overdue).length} 个逾期项，今天别继续堆债。`:`今日 ${tasks.filter(isToday).length} 个关键动作，做完再新增。`;renderNav();Object.keys(views).forEach(v=>document.getElementById(v).classList.toggle("active",v===view));renderDashboard();renderList("customer","customers");renderAgents();renderScripts();renderCalendar()}
    function renderNav(){document.getElementById("nav").innerHTML=[["dashboard","⌂","今日工作"],["customers","◇","客户档案"],["agents","◎","代理档案"],["scripts","✎","脚本"],["calendar","□","日历"]].map(([id,ic,lab])=>`<button class="${view===id?"active":""}" data-view="${id}"><span>${ic}</span><span>${lab}</span></button>`).join("")}
    function summaryCard(label,value,tone=""){return `<article class="card ${tone}"><div class="label">${label}</div><div class="value">${value}</div></article>`}
    function renderDashboard(){const el=document.getElementById("dashboard");el.innerHTML=`<div class="quick"><button data-open="customer"><span>01</span><strong>客户下单</strong><small>记录姓名、产品、金额、调理问题，自动生成 3 天和 7 天回访。</small></button><button data-open="agent"><span>02</span><strong>新代理加入</strong><small>自动排电话定心、朋友圈复盘、流量启动。</small></button><button data-open="script"><span>03</span><strong>收爆款脚本</strong><small>保存来源、爆点和待拍日期，拍摄时直接看待拍池。</small></button></div><div class="summary">${summaryCard("今日客户跟进",tasks.filter(t=>t.type==="customer"&&isToday(t)).length)}${summaryCard("逾期客户跟进",tasks.filter(t=>t.type==="customer"&&overdue(t)).length,"danger")}${summaryCard("今日代理任务",tasks.filter(t=>t.type==="agent"&&isToday(t)).length,"light")}${summaryCard("逾期代理任务",tasks.filter(t=>t.type==="agent"&&overdue(t)).length,"danger")}${summaryCard("今日待拍脚本",tasks.filter(t=>t.type==="script"&&isToday(t)).length,"gold")}${summaryCard("逾期脚本",tasks.filter(t=>t.type==="script"&&overdue(t)).length,"danger")}${summaryCard("活跃客户",tasks.filter(t=>t.type==="customer"&&!t.done).length)}${summaryCard("活跃代理",tasks.filter(t=>t.type==="agent"&&!t.done).length,"light")}</div>${dataBoard()}<div class="work">${panel("今日客户跟进",tasks.filter(t=>t.type==="customer"&&isToday(t)),"customer")}${panel("逾期客户跟进",tasks.filter(t=>t.type==="customer"&&overdue(t)),"customers")}${panel("今日代理孵化",tasks.filter(t=>t.type==="agent"&&isToday(t)),"agent")}${panel("今日待拍脚本",tasks.filter(t=>t.type==="script"&&isToday(t)),"script")}</div>`}
    function dataBoard(){let open=tasks.filter(t=>!t.done),over=tasks.filter(overdue).length,tc=tasks.filter(isToday).length,hi=open.filter(t=>t.priority==="high").length,ready=open.filter(t=>t.type==="script"&&t.stage==="待拍摄").length;return `<section class="data"><div class="data-head"><div><p class="eyebrow">DATA VIEW</p><h2>一眼看今天卡在哪里</h2></div><div class="pulse"><span>${over?"先清逾期":"节奏正常"}</span><strong>${over||tc}</strong></div></div><div class="signals">${signal("高优先动作",hi,"今天最该先处理")}${signal("逾期未处理",over,"拖久会漏售后和带教",over>0)}${signal("今日动作",tc,"当前工作量")}${signal("待拍脚本",ready,"拍视频时直接打开")}</div><div class="pipes">${pipe("客户售后节奏",["收货回访","一周复盘","方案调整","复购维护"])}${pipe("代理启动节奏",["电话定心","朋友圈复盘","流量启动","独立带教"])}${pipe("脚本生产池",["待拍摄","待剪辑","待发布","已发布"])}</div></section>`}
    function signal(l,v,h,d=false){return `<article class="signal ${d?"danger":""}"><span>${l}</span><strong>${v}</strong><small>${h}</small></article>`}function pipe(title,ss){let max=Math.max(1,...ss.map(s=>tasks.filter(t=>t.stage===s&&!t.done).length));return `<article class="pipe"><h3>${title}</h3>${ss.map(s=>{let c=tasks.filter(t=>t.stage===s&&!t.done).length;return `<div class="bar"><span>${s}</span><div class="track"><div style="width:${Math.max(8,c/max*100)}%"></div></div><b>${c}</b></div>`}).join("")}</article>`}
    function panel(title,items,openType){return `<section class="panel"><div class="panel-head"><h2>${title}</h2><button class="text" ${openType.length>6?`data-view="${openType}"`:`data-open="${openType}"`}>${openType.length>6?"查看全部":"新增"}</button></div>${list(items)}</section>`}
    function item(t){return `<article class="item"><div><div class="title"><span>${esc(t.name)}</span><span class="chip ${t.priority}">${pri(t.priority)}</span></div><div class="meta">${t.stage} · ${t.date} · ${esc(t.action)}</div>${t.meta?.length?`<div class="chips">${t.meta.map(m=>`<span class="chip">${esc(m)}</span>`).join("")}</div>`:""}</div><button class="mini" data-done="${t.id}">${t.done?"恢复":"完成"}</button></article>`}function list(items){let a=sort(items).slice(0,8);return a.length?`<div class="list">${a.map(item).join("")}</div>`:`<div class="empty">没有任务，别硬塞。把精力留给高价值动作。</div>`}
    function filters(tp){let labs=tp==="script"?[["all","全部"],["today","今日待拍"],["overdue","逾期"],["done","已拍"]]:[["all","全部"],["today","今日"],["overdue","逾期"],["done","已完成"]];return `<div class="seg">${labs.map(([k,l])=>`<button class="${filter[tp]===k?"active":""}" data-filter="${tp}:${k}">${l}</button>`).join("")}</div>`}function filtered(tp){return sort(tasks.filter(t=>t.type===tp)).filter(t=>filter[tp]==="today"?isToday(t):filter[tp]==="overdue"?overdue(t):filter[tp]==="done"?t.done:true)}
    function renderList(tp,id){document.getElementById(id).innerHTML=`<div class="toolbar">${filters(tp)}<button class="btn primary" data-open="${tp}">+ ${tp==="customer"?"客户下单":"新增"}</button></div><div class="list">${filtered(tp).map(item).join("")||"<div class='empty'>暂无记录。</div>"}</div>`}
    function renderAgents(){renderList("agent","agents")}function renderScripts(){document.getElementById("scripts").innerHTML=`<div class="toolbar">${filters("script")}<button class="btn primary" data-open="script">+ 收录脚本</button></div><div class="cards">${filtered("script").map(t=>`<article class="script"><h2>${esc(t.name)}</h2><p>${esc(t.action)}</p>${t.meta?.length?`<div class="chips">${t.meta.map(m=>`<span class="chip">${esc(m)}</span>`).join("")}</div>`:""}<div class="title"><span class="chip">${t.stage}</span><span class="chip ${t.priority}">${t.date}</span><span class="chip">${status(t)}</span></div><button class="mini" data-done="${t.id}">${t.done?"恢复":"完成"}</button></article>`).join("")||"<div class='empty'>暂无脚本。</div>"}</div>`}
    function renderCalendar(){let days=Array.from({length:7},(_,i)=>add(today,i));document.getElementById("calendar").innerHTML=`<div class="calendar">${days.map(d=>`<article class="day"><strong>${new Intl.DateTimeFormat("zh-CN",{month:"numeric",day:"numeric",weekday:"short"}).format(new Date(d+"T00:00:00"))}</strong><span>${tasks.filter(t=>!t.done&&t.date===d).length} 个动作</span></article>`).join("")}</div><section class="panel"><div class="panel-head"><h2>未来 7 天排期</h2><span class="muted">脚本拍摄 + 代理动作 + 客户跟进</span></div><div class="timeline">${days.map(d=>`<div class="timeline-row"><strong>${new Intl.DateTimeFormat("zh-CN",{month:"long",day:"numeric",weekday:"long"}).format(new Date(d+"T00:00:00"))}</strong>${list(tasks.filter(t=>!t.done&&t.date===d))}</div>`).join("")}</div></section>`}
    function openForm(tp){type=tp;draft={name:"",product:"",amount:"",issue:"",source:"",hook:"",date:today,priority:"medium",action:""};document.getElementById("modalTitle").textContent=tp==="customer"?"客户下单":tp==="agent"?"新代理加入":"收爆款脚本";document.getElementById("fields").innerHTML=fields(tp);document.getElementById("modal").classList.add("active")}function fields(tp){let name=tp==="script"?"脚本标题":tp==="customer"?"客户名称":"代理名称";let extra=tp==="customer"?`<div class="row"><label><span>下单产品</span><input id="product" placeholder="山药玉米糊 / 组合装"></label><label><span>成交金额</span><input id="amount" inputmode="decimal" placeholder="398"></label></div><label><span>调理问题</span><input id="issue" placeholder="脾胃弱、湿气重、睡眠差"></label>`:tp==="agent"?`<label><span>代理当前卡点</span><input id="issue" placeholder="怕发朋友圈 / 不会讲产品 / 节奏乱"></label>`:`<div class="row"><label><span>脚本来源</span><input id="source" placeholder="自己测出 / 团队测出"></label><label><span>爆点</span><input id="hook" placeholder="早餐误区 / 舌苔对比"></label></div>`;return `<label><span>${name}</span><input id="name" placeholder="${tp==="script"?"湿气重的人早餐别乱吃":"王姐 / 代理小晴"}"></label>${extra}<label><span>${tp==="customer"?"下单日期":tp==="agent"?"加入日期":"待拍日期"}</span><input id="dateInput" type="date" value="${today}"></label><label><span>${tp==="script"?"脚本内容 / 复刻角度":"补充备注"}</span><textarea id="action" rows="3" placeholder="${tp==="script"?"把爆款脚本结构或拍摄要点粘进来。":"可不填，只写特殊情况。"}"></textarea></label>`}
    function saveTask(){let name=val("name");if(!name)return;let date=val("dateInput")||today,product=val("product")||"食养产品",amount=val("amount"),issue=val("issue"),source=val("source"),hook=val("hook"),action=val("action");let meta=[product&&`产品：${product}`,amount&&`金额：${amount}`,issue&&`问题：${issue}`,source&&`来源：${source}`,hook&&`爆点：${hook}`].filter(Boolean),next=[];if(type==="customer")next=[{id:uid(),type,name,stage:"收货回访",action:`确认是否收到${product}，问口感味道、食用是否顺手，提醒开始连续打卡。${issue?`调理问题：${issue}。`:""}`,date:add(date,3),priority:"high",done:false,meta},{id:uid(),type,name,stage:"一周复盘",action:`跟进舌苔照片、打卡情况、前后对比和效果感受，判断是否调整方案或沉淀见证。${action?`补充：${action}`:""}`,date:add(date,7),priority:"high",done:false,meta}];if(type==="agent")next=[{id:uid(),type,name,stage:"电话定心",action:`约 30 分钟电话，梳理加入节奏、定心态，明确第一周先发朋友圈。${action?`补充：${action}`:""}`,date:add(date,1),priority:"high",done:false,meta:[`加入：${date}`,...meta]},{id:uid(),type,name,stage:"朋友圈复盘",action:"看近 2-3 天朋友圈：人设、产品信任、生活感、成交入口是否到位，及时给修改建议。",date:add(date,3),priority:"high",done:false,meta:[`加入：${date}`,...meta]},{id:uid(),type,name,stage:"流量启动",action:"朋友圈铺垫满一周后，带她做小红书/短视频流量动作，定第一个内容选题和引流路径。",date:add(date,7),priority:"medium",done:false,meta:[`加入：${date}`,...meta]}];if(type==="script")next=[{id:uid(),type,name,stage:"待拍摄",action:action||"待拍摄：复刻爆点，结合自己的客户案例和表达方式重拍一版。",date,priority:"medium",done:false,meta}];tasks=[...next,...tasks];saveLocal();closeModal();render()}
    function val(id){let e=document.getElementById(id);return e?e.value.trim():""}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function closeModal(){document.getElementById("modal").classList.remove("active")}document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.view){view=b.dataset.view;render()}if(b.dataset.open)openForm(b.dataset.open);if(b.dataset.done){tasks=tasks.map(t=>t.id===b.dataset.done?{...t,done:!t.done}:t);saveLocal();render()}if(b.dataset.filter){let [tp,k]=b.dataset.filter.split(":");filter[tp]=k;render()}});document.getElementById("save").onclick=saveTask;document.getElementById("close").onclick=closeModal;document.getElementById("cancel").onclick=closeModal;document.getElementById("export").onclick=()=>{let blob=new Blob([JSON.stringify(tasks,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`食养工作台-${today}.json`;a.click();URL.revokeObjectURL(url)};render();
  </script>
